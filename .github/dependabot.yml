version: 2
# Every ecosystem waits 3 days after a release before proposing it. pnpm-workspace.yaml
# sets the same minimumReleaseAge, so lockfiles made here can always be re-resolved by
# Dependabot. Security updates are not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Purser runs on Node 24, the long-term support line, as .nvmrc says.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # Node type definitions follow the Node version we run (.nvmrc), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
