name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit hashes. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Packs the npm packages and runs them as npx would, from a clean folder.
      - name: Package smoke test
        run: |
          set -euo pipefail
          out=$(mktemp -d)
          pnpm --filter @roai-us/roi-core pack --pack-destination "$out"
          pnpm --filter @roai-us/purser pack --pack-destination "$out"
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$out"/*.tgz
          ./node_modules/.bin/roai help | grep "ROAI Purser" >/dev/null
          PURSER_DATA_DIR="$(mktemp -d)" ./node_modules/.bin/roai --no-open > serve.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4141/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4141/health | grep '"ok":true' >/dev/null
          curl -fsS http://127.0.0.1:4141/ | grep "<title>ROAI Purser</title>" >/dev/null
          kill "$pid"
