name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Builds the image and checks it the way a person would use it.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to full commit hashes. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: purser:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name purser -p 127.0.0.1:4141:4141 -v purser-data:/data purser:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4141/health && break
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:4141/health | grep -q '"ok":true'
          # The web UI is served.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4141/)" = 200
          # It runs as the unprivileged node user, not root.
          test "$(docker exec purser id -u)" != 0
          # The sign-in link uses the public address, not the one it listens on.
          docker logs purser 2>&1 | grep -q 'Open Purser: http://localhost:4141/login?code='
          # The admin token is kept in the volume, readable only by Purser.
          test "$(docker exec purser stat -c '%a' /data/admin-token)" = 600
          token=$(docker exec purser cat /data/admin-token)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" http://127.0.0.1:4141/admin/overview)" = 200
          # It stops on SIGTERM straight away, not after Docker's 10-second wait.
          start=$(date +%s)
          docker stop purser
          test $(( $(date +%s) - start )) -lt 5
          test "$(docker inspect -f '{{.State.ExitCode}}' purser)" = 0
          # Data survives a new container on the same volume.
          docker rm purser
          docker run -d --name purser -p 127.0.0.1:4141:4141 -v purser-data:/data purser:test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4141/health >/dev/null && break
            sleep 1
          done
          test "$(docker exec purser cat /data/admin-token)" = "$token"
          # The CLI runs through the same entrypoint.
          docker run --rm purser:test help | grep -q 'roai serve'
          # Docker's own health check passes.
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' purser)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
      - name: Logs on failure
        if: failure()
        run: docker logs purser 2>&1 | sed -E 's/code=[A-Za-z0-9_-]+/code=REDACTED/' || true

  # Publishes to the GitHub Container Registry, only for a version tag.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must match the server's version
        run: |
          version=$(node -p 'require("./apps/server/package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/server/package.json ($version)."
            exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/roai-us/purser
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          provenance: true
          sbom: true
