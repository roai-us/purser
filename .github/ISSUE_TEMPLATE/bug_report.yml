name: Bug report
description: Something in ROAI Purser doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If it's a security problem, please don't use this form. Follow the [security policy](https://github.com/roai-us/purser/security/policy) instead.

        Never paste a provider key, an agent key or an admin key here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect to see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Agents page
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release you run, or the commit hash if you built from source.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - npx or a local build
        - Docker
        - Something else (say below)
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI provider involved, if any
      placeholder: OpenAI, OpenRouter, xAI, ...
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any keys, names or prompt content first.
